<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
<defs>
  <!-- Backgrounds -->
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0c001f"/>
    <stop offset="100%" stop-color="#020008"/>
  </linearGradient>
  <linearGradient id="machineGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#2e1065"/>
    <stop offset="30%" stop-color="#1a0840"/>
    <stop offset="70%" stop-color="#120632"/>
    <stop offset="100%" stop-color="#0a041e"/>
  </linearGradient>
  <linearGradient id="topBand" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#3b0f8c"/>
    <stop offset="100%" stop-color="#1e0848"/>
  </linearGradient>
  <linearGradient id="btmBand" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0e052c"/>
    <stop offset="100%" stop-color="#080318"/>
  </linearGradient>
  <radialGradient id="reelBg" cx="50%" cy="50%" r="70%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#100030"/>
    <stop offset="100%" stop-color="#050018"/>
  </radialGradient>
  <radialGradient id="spinBtn" cx="40%" cy="35%" r="65%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#9333ea"/>
    <stop offset="100%" stop-color="#4c1d95"/>
  </radialGradient>
  <radialGradient id="leverKnob" cx="35%" cy="30%" r="65%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#fca5a5"/>
    <stop offset="60%" stop-color="#ef4444"/>
    <stop offset="100%" stop-color="#991b1b"/>
  </radialGradient>
  <linearGradient id="leverChrome" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#6b7280"/>
    <stop offset="45%" stop-color="#e5e7eb"/>
    <stop offset="100%" stop-color="#6b7280"/>
  </linearGradient>
  <!-- Window edge fade: opaque at top+bottom, transparent in middle -->
  <linearGradient id="windowFade" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="#090020"/>
    <stop offset="28%"  stop-color="#090020" stop-opacity="0"/>
    <stop offset="72%"  stop-color="#090020" stop-opacity="0"/>
    <stop offset="100%" stop-color="#090020"/>
  </linearGradient>

  <!-- Glow filters -->
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="symGlow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Reel clip paths -->
  <clipPath id="c1"><rect x="132" y="93" width="128" height="112" rx="4"/></clipPath>
  <clipPath id="c2"><rect x="386" y="93" width="128" height="112" rx="4"/></clipPath>
  <clipPath id="c3"><rect x="640" y="93" width="128" height="112" rx="4"/></clipPath>

  <!-- Scanlines -->
  <pattern id="scanlines" x="0" y="0" width="1" height="5" patternUnits="userSpaceOnUse">
    <rect width="900" height="2" fill="black" opacity="0.14"/>
  </pattern>

  <clipPath id="svgBound"><rect width="900" height="300"/></clipPath>
</defs>

<g clip-path="url(#svgBound)">

<!-- ── BACKGROUND ─────────────────────────────────────────── -->
<rect width="900" height="300" fill="url(#bg)"/>
<!-- Ambient glow -->
<ellipse cx="450" cy="152" rx="390" ry="120" fill="#4c1d95" opacity="0.09" filter="url(#strongGlow)"/>

<!-- ── MACHINE BODY ────────────────────────────────────────── -->
<!-- Drop shadow -->
<rect x="86" y="30" width="718" height="246" rx="20" fill="#000" opacity="0.55"/>
<!-- Body -->
<rect x="80" y="24" width="718" height="246" rx="20" fill="url(#machineGrad)"/>
<!-- Top band -->
<rect x="80" y="24" width="718" height="64" rx="20" fill="url(#topBand)"/>
<rect x="80" y="68"  width="718" height="20" fill="#1e0848"/>
<!-- Bottom band -->
<rect x="80" y="216" width="718" height="54" rx="20" fill="url(#btmBand)"/>
<rect x="80" y="216" width="718" height="20" fill="#0e052c"/>
<!-- Top gloss -->
<rect x="86" y="26" width="706" height="38" rx="16" fill="white" opacity="0.035"/>
<!-- Neon border outer -->
<rect x="80" y="24" width="718" height="246" rx="20" fill="none"
      stroke="#7c3aed" stroke-width="2.5" filter="url(#glow)"/>
<!-- Neon border inner -->
<rect x="85" y="29" width="708" height="236" rx="18" fill="none"
      stroke="#a855f7" stroke-width="0.8" opacity="0.35"/>

<!-- Corner indicator LEDs -->
<circle cx="104" cy="50" r="6.5" fill="#1a0840" stroke="#6d28d9" stroke-width="1.5"/>
<circle cx="104" cy="50" r="2.8" fill="#8b5cf6">
  <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
</circle>
<circle cx="121" cy="50" r="6.5" fill="#1a0840" stroke="#6d28d9" stroke-width="1.5"/>
<circle cx="121" cy="50" r="2.8" fill="#06b6d4">
  <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
</circle>
<circle cx="757" cy="50" r="6.5" fill="#1a0840" stroke="#6d28d9" stroke-width="1.5"/>
<circle cx="757" cy="50" r="2.8" fill="#06b6d4">
  <animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/>
</circle>
<circle cx="774" cy="50" r="6.5" fill="#1a0840" stroke="#6d28d9" stroke-width="1.5"/>
<circle cx="774" cy="50" r="2.8" fill="#8b5cf6">
  <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
</circle>

<!-- ── TITLE ──────────────────────────────────────────────── -->
<text x="439" y="59"
      font-family="'Arial Black',Impact,'Helvetica Neue',sans-serif"
      font-size="17" font-weight="900" text-anchor="middle" letter-spacing="7"
      fill="#22d3ee" filter="url(#glow)">◈  S T A C K . S L O T S  ◈</text>

<!-- ── REEL WINDOWS ───────────────────────────────────────── -->
<!-- Window 1 -->
<rect x="132" y="93" width="128" height="112" rx="4" fill="url(#reelBg)" stroke="#6d28d9" stroke-width="2"/>
<!-- Window 2 -->
<rect x="386" y="93" width="128" height="112" rx="4" fill="url(#reelBg)" stroke="#6d28d9" stroke-width="2"/>
<!-- Window 3 -->
<rect x="640" y="93" width="128" height="112" rx="4" fill="url(#reelBg)" stroke="#6d28d9" stroke-width="2"/>

<!-- Win-line dashes between windows -->
<line x1="86"  y1="149" x2="132" y2="149" stroke="#facc15" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>
<line x1="260" y1="149" x2="386" y2="149" stroke="#facc15" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>
<line x1="514" y1="149" x2="640" y2="149" stroke="#facc15" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>
<line x1="768" y1="149" x2="798" y2="149" stroke="#facc15" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>

<!-- Win-line pointer arrows -->
<polygon points="108,143 124,149 108,155" fill="#facc15" filter="url(#glow)">
  <animate attributeName="opacity" values="1;0.25;1" dur="1.3s" repeatCount="indefinite"/>
</polygon>
<polygon points="770,143 754,149 770,155" fill="#facc15" filter="url(#glow)">
  <animate attributeName="opacity" values="1;0.25;1" dur="1.3s" repeatCount="indefinite"/>
</polygon>

<!-- ── REEL 1 — Languages ─────────────────────────────────── -->
<!-- each symbol 90px apart, 6 unique + 1 dup = animate 0→-540 seamlessly -->
<g clip-path="url(#c1)">
  <g>
    <animateTransform attributeName="transform" type="translate"
                      from="0,0" to="0,-540"
                      dur="2.5s" repeatCount="indefinite" calcMode="linear"/>
    <text x="196" y="163" font-family="'Arial Black',Impact,sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="#f7df1e" filter="url(#symGlow)">JS</text>
    <text x="196" y="253" font-family="'Arial Black',Impact,sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="#3b82f6" filter="url(#symGlow)">TS</text>
    <text x="196" y="343" font-family="'Arial Black',Impact,sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="#4ade80" filter="url(#symGlow)">PY</text>
    <text x="196" y="433" font-family="'Arial Black',Impact,sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="#22d3ee" filter="url(#symGlow)">GO</text>
    <text x="196" y="523" font-family="'Arial Black',Impact,sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="#f97316" filter="url(#symGlow)">RS</text>
    <text x="196" y="613" font-family="'Arial Black',Impact,sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="#c084fc" filter="url(#symGlow)">C#</text>
    <!-- dup of first for seamless loop -->
    <text x="196" y="703" font-family="'Arial Black',Impact,sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="#f7df1e" filter="url(#symGlow)">JS</text>
  </g>
</g>
<!-- fade + scanlines overlay -->
<rect x="132" y="93" width="128" height="112" rx="4" fill="url(#windowFade)"/>
<rect x="132" y="93" width="128" height="112" fill="url(#scanlines)"/>
<!-- window inner rim -->
<rect x="132" y="93" width="128" height="112" rx="4" fill="none" stroke="#0a0025" stroke-width="3.5" opacity="0.7"/>

<!-- ── REEL 2 — Code Symbols ──────────────────────────────── -->
<g clip-path="url(#c2)">
  <g>
    <animateTransform attributeName="transform" type="translate"
                      from="0,0" to="0,-540"
                      dur="3.3s" repeatCount="indefinite" calcMode="linear"/>
    <text x="450" y="161" font-family="'Courier New',Courier,monospace" font-size="38" font-weight="900" text-anchor="middle" fill="#fbbf24" filter="url(#symGlow)">{  }</text>
    <text x="450" y="251" font-family="'Courier New',Courier,monospace" font-size="34" font-weight="900" text-anchor="middle" fill="#fb923c" filter="url(#symGlow)">&lt;/&gt;</text>
    <text x="450" y="341" font-family="'Courier New',Courier,monospace" font-size="38" font-weight="900" text-anchor="middle" fill="#4ade80" filter="url(#symGlow)">$_</text>
    <text x="450" y="431" font-family="'Courier New',Courier,monospace" font-size="38" font-weight="900" text-anchor="middle" fill="#a78bfa" filter="url(#symGlow)">=&gt;</text>
    <text x="450" y="521" font-family="'Courier New',Courier,monospace" font-size="40" font-weight="900" text-anchor="middle" fill="#38bdf8" filter="url(#symGlow)">::</text>
    <text x="450" y="611" font-family="'Courier New',Courier,monospace" font-size="40" font-weight="900" text-anchor="middle" fill="#e879f9" filter="url(#symGlow)">//</text>
    <text x="450" y="701" font-family="'Courier New',Courier,monospace" font-size="38" font-weight="900" text-anchor="middle" fill="#fbbf24" filter="url(#symGlow)">{  }</text>
  </g>
</g>
<rect x="386" y="93" width="128" height="112" rx="4" fill="url(#windowFade)"/>
<rect x="386" y="93" width="128" height="112" fill="url(#scanlines)"/>
<rect x="386" y="93" width="128" height="112" rx="4" fill="none" stroke="#0a0025" stroke-width="3.5" opacity="0.7"/>

<!-- ── REEL 3 — Tools / DevOps ────────────────────────────── -->
<g clip-path="url(#c3)">
  <g>
    <animateTransform attributeName="transform" type="translate"
                      from="0,0" to="0,-540"
                      dur="4.4s" repeatCount="indefinite" calcMode="linear"/>
    <text x="704" y="163" font-family="'Arial Black',Impact,sans-serif" font-size="41" font-weight="900" text-anchor="middle" fill="#f1502f" filter="url(#symGlow)">GIT</text>
    <text x="704" y="253" font-family="'Arial Black',Impact,sans-serif" font-size="41" font-weight="900" text-anchor="middle" fill="#7090d0" filter="url(#symGlow)">SQL</text>
    <text x="704" y="343" font-family="'Arial Black',Impact,sans-serif" font-size="41" font-weight="900" text-anchor="middle" fill="#818cf8" filter="url(#symGlow)">API</text>
    <text x="704" y="433" font-family="'Arial Black',Impact,sans-serif" font-size="41" font-weight="900" text-anchor="middle" fill="#34d399" filter="url(#symGlow)">CLI</text>
    <text x="704" y="523" font-family="'Arial Black',Impact,sans-serif" font-size="41" font-weight="900" text-anchor="middle" fill="#60a5fa" filter="url(#symGlow)">CSS</text>
    <text x="704" y="613" font-family="'Arial Black',Impact,sans-serif" font-size="41" font-weight="900" text-anchor="middle" fill="#fb923c" filter="url(#symGlow)">AWS</text>
    <text x="704" y="703" font-family="'Arial Black',Impact,sans-serif" font-size="41" font-weight="900" text-anchor="middle" fill="#f1502f" filter="url(#symGlow)">GIT</text>
  </g>
</g>
<rect x="640" y="93" width="128" height="112" rx="4" fill="url(#windowFade)"/>
<rect x="640" y="93" width="128" height="112" fill="url(#scanlines)"/>
<rect x="640" y="93" width="128" height="112" rx="4" fill="none" stroke="#0a0025" stroke-width="3.5" opacity="0.7"/>

<!-- ── BOTTOM UI ───────────────────────────────────────────── -->

<!-- Credits display -->
<rect x="107" y="226" width="124" height="32" rx="4" fill="#08021a" stroke="#3b0764" stroke-width="1"/>
<text x="169" y="237" font-family="'Courier New',monospace" font-size="7.5" text-anchor="middle" fill="#6d28d9" letter-spacing="1.5">CREDITS</text>
<text x="169" y="252" font-family="'Courier New',monospace" font-size="17" font-weight="bold" text-anchor="middle" fill="#7c3aed">∞  ∞  ∞</text>

<!-- SPIN button -->
<rect x="369" y="226" width="140" height="36" rx="18" fill="url(#spinBtn)" stroke="#9333ea" stroke-width="1.5" filter="url(#glow)">
  <animate attributeName="opacity" values="1;0.75;1" dur="2.4s" repeatCount="indefinite"/>
</rect>
<rect x="369" y="226" width="140" height="36" rx="18" fill="none" stroke="#d8b4fe" stroke-width="0.6" opacity="0.5"/>
<text x="439" y="249" font-family="'Arial Black',Impact,sans-serif"
      font-size="13" font-weight="900" text-anchor="middle" letter-spacing="4" fill="#f3e8ff">▶  SPIN</text>

<!-- High score display -->
<rect x="647" y="226" width="124" height="32" rx="4" fill="#08021a" stroke="#3b0764" stroke-width="1"/>
<text x="709" y="237" font-family="'Courier New',monospace" font-size="7.5" text-anchor="middle" fill="#6d28d9" letter-spacing="1">HIGH SCORE</text>
<text x="709" y="252" font-family="'Courier New',monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#7c3aed">01001111</text>

<!-- INSERT COIN blink -->
<text x="439" y="280" font-family="'Courier New',monospace" font-size="9"
      text-anchor="middle" letter-spacing="2" fill="#6d28d9">
  ⚡  INSERT COIN TO PLAY  ⚡
  <animate attributeName="opacity" values="1;0;1" dur="1.7s" repeatCount="indefinite"/>
</text>

<!-- ── LEVER ──────────────────────────────────────────────── -->
<!-- Track -->
<rect x="830" y="90" width="12" height="116" rx="6" fill="#14052e" stroke="#3b0764" stroke-width="1.2"/>
<!-- Animated pull -->
<g>
  <animateTransform attributeName="transform" type="translate"
                    values="0,0; 0,76; 0,76; 0,0"
                    keyTimes="0;0.35;0.65;1"
                    dur="5s" repeatCount="indefinite" calcMode="spline"
                    keySplines="0.4 0 0.2 1; 0 0 0 0; 0.4 0 0.2 1"/>
  <line x1="836" y1="102" x2="836" y2="158" stroke="url(#leverChrome)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="836" cy="94" r="13" fill="url(#leverKnob)" stroke="#7f1d1d" stroke-width="1.5"/>
  <circle cx="831" cy="89" r="3.5" fill="#fecaca" opacity="0.65"/>
</g>
<!-- Lever base plate -->
<rect x="822" y="202" width="28" height="10" rx="4" fill="#2e1065"/>

</g>
</svg>
