<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <!-- Deep space background gradient -->
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d0a2e"/>
      <stop offset="60%" stop-color="#04020f"/>
      <stop offset="100%" stop-color="#000005"/>
    </radialGradient>

    <!-- Nebula glow gradients -->
    <radialGradient id="nebula1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="75%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula3" cx="55%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Black hole core gradient -->
    <radialGradient id="bhCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="70%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#1a0533"/>
    </radialGradient>

    <!-- Accretion disk gradients -->
    <radialGradient id="diskOuter" cx="50%" cy="50%" r="50%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ff8c00" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#ffd700" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#ff4500" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c00" stop-opacity="0"/>
    </radialGradient>

    <!-- Gravitational lensing ring gradient -->
    <radialGradient id="lensRing" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="85%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="90%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="95%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Photon ring glow -->
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="diskBlur" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="3 8"/>
    </filter>
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <!-- Clip path for SVG bounds -->
    <clipPath id="svgBounds">
      <rect width="900" height="300"/>
    </clipPath>

    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0d7ff"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="subtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#svgBounds)">
    <!-- Background -->
    <rect width="900" height="300" fill="url(#spaceGrad)"/>

    <!-- Nebula clouds -->
    <ellipse cx="270" cy="120" rx="320" ry="200" fill="url(#nebula1)"/>
    <ellipse cx="675" cy="180" rx="300" ry="180" fill="url(#nebula2)"/>
    <ellipse cx="495" cy="60" rx="250" ry="140" fill="url(#nebula3)"/>

    <!-- Stars layer 1 — tiny, numerous -->
    <g fill="white" opacity="0.7">
      <circle cx="22" cy="18" r="0.6"/><circle cx="58" cy="7" r="0.5"/>
      <circle cx="101" cy="42" r="0.7"/><circle cx="143" cy="11" r="0.5"/>
      <circle cx="178" cy="33" r="0.6"/><circle cx="217" cy="56" r="0.4"/>
      <circle cx="254" cy="14" r="0.7"/><circle cx="299" cy="38" r="0.5"/>
      <circle cx="336" cy="22" r="0.6"/><circle cx="377" cy="9" r="0.4"/>
      <circle cx="415" cy="47" r="0.7"/><circle cx="462" cy="19" r="0.5"/>
      <circle cx="507" cy="31" r="0.6"/><circle cx="548" cy="8" r="0.4"/>
      <circle cx="591" cy="44" r="0.7"/><circle cx="634" cy="16" r="0.5"/>
      <circle cx="677" cy="29" r="0.6"/><circle cx="719" cy="53" r="0.4"/>
      <circle cx="758" cy="12" r="0.7"/><circle cx="803" cy="37" r="0.5"/>
      <circle cx="841" cy="21" r="0.6"/><circle cx="876" cy="48" r="0.4"/>
      <circle cx="38" cy="82" r="0.5"/><circle cx="76" cy="68" r="0.7"/>
      <circle cx="118" cy="91" r="0.4"/><circle cx="157" cy="74" r="0.6"/>
      <circle cx="199" cy="103" r="0.5"/><circle cx="238" cy="77" r="0.7"/>
      <circle cx="281" cy="94" r="0.4"/><circle cx="323" cy="70" r="0.6"/>
      <circle cx="364" cy="88" r="0.5"/><circle cx="403" cy="66" r="0.7"/>
      <circle cx="12" cy="128" r="0.6"/><circle cx="47" cy="141" r="0.4"/>
      <circle cx="89" cy="117" r="0.7"/><circle cx="131" cy="153" r="0.5"/>
      <circle cx="166" cy="133" r="0.6"/><circle cx="208" cy="148" r="0.4"/>
      <circle cx="249" cy="126" r="0.7"/>
      <!-- Right side stars -->
      <circle cx="561" cy="72" r="0.5"/><circle cx="603" cy="88" r="0.7"/>
      <circle cx="648" cy="61" r="0.4"/><circle cx="689" cy="77" r="0.6"/>
      <circle cx="731" cy="94" r="0.5"/><circle cx="772" cy="68" r="0.7"/>
      <circle cx="812" cy="83" r="0.4"/><circle cx="853" cy="72" r="0.6"/>
      <circle cx="888" cy="91" r="0.5"/>
      <circle cx="543" cy="131" r="0.7"/><circle cx="582" cy="148" r="0.4"/>
      <circle cx="624" cy="119" r="0.6"/><circle cx="661" cy="143" r="0.5"/>
      <circle cx="699" cy="127" r="0.7"/><circle cx="742" cy="153" r="0.4"/>
      <circle cx="783" cy="138" r="0.6"/><circle cx="821" cy="117" r="0.5"/>
      <circle cx="862" cy="141" r="0.7"/><circle cx="893" cy="128" r="0.4"/>
      <!-- Bottom area -->
      <circle cx="33" cy="198" r="0.6"/><circle cx="71" cy="213" r="0.4"/>
      <circle cx="109" cy="187" r="0.7"/><circle cx="149" cy="222" r="0.5"/>
      <circle cx="186" cy="204" r="0.6"/><circle cx="224" cy="218" r="0.4"/>
      <circle cx="29" cy="257" r="0.5"/><circle cx="63" cy="241" r="0.7"/>
      <circle cx="98" cy="268" r="0.4"/><circle cx="139" cy="254" r="0.6"/>
      <circle cx="171" cy="273" r="0.5"/><circle cx="207" cy="248" r="0.7"/>
      <circle cx="602" cy="198" r="0.6"/><circle cx="643" cy="213" r="0.4"/>
      <circle cx="681" cy="187" r="0.7"/><circle cx="717" cy="222" r="0.5"/>
      <circle cx="756" cy="204" r="0.6"/><circle cx="793" cy="218" r="0.4"/>
      <circle cx="831" cy="198" r="0.7"/><circle cx="866" cy="212" r="0.5"/>
      <circle cx="898" cy="201" r="0.6"/>
      <circle cx="621" cy="257" r="0.5"/><circle cx="659" cy="241" r="0.7"/>
      <circle cx="697" cy="268" r="0.4"/><circle cx="733" cy="254" r="0.6"/>
      <circle cx="771" cy="273" r="0.5"/><circle cx="809" cy="248" r="0.7"/>
      <circle cx="847" cy="261" r="0.4"/><circle cx="883" cy="279" r="0.6"/>
    </g>

    <!-- Stars layer 2 — bright twinklers -->
    <g filter="url(#starGlow)">
      <circle cx="55" cy="55" r="1.4" fill="#e0e8ff">
        <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="190" cy="28" r="1.6" fill="#ffd6fa">
        <animate attributeName="opacity" values="0.7;0.1;0.7" dur="4.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="320" cy="52" r="1.3" fill="#d6f0ff">
        <animate attributeName="opacity" values="0.8;0.15;0.8" dur="2.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="82" cy="245" r="1.5" fill="#e0e8ff">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="5.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="155" cy="270" r="1.2" fill="#ffd6fa">
        <animate attributeName="opacity" values="0.9;0.1;0.9" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <!-- Right twinklers -->
      <circle cx="838" cy="44" r="1.5" fill="#d6f0ff">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="712" cy="22" r="1.3" fill="#e0e8ff">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="870" cy="251" r="1.6" fill="#ffd6fa">
        <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="798" cy="273" r="1.2" fill="#d6f0ff">
        <animate attributeName="opacity" values="0.7;0.15;0.7" dur="4.9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ===== BLACK HOLE — centered at (225, 150) ===== -->
    <g transform="translate(225,150)">

      <!-- Distant accretion disk glow (very diffuse) -->
      <ellipse cx="0" cy="0" rx="110" ry="28" fill="#ff6b00" opacity="0.08" filter="url(#glowStrong)"/>

      <!-- Spinning accretion disk — outer haze -->
      <g filter="url(#diskBlur)">
        <ellipse cx="0" cy="0" rx="108" ry="22" fill="none" stroke="#ff8c00" stroke-width="18" stroke-opacity="0.25">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <!-- Accretion disk main — hot orbital rings -->
      <g>
        <!-- Outer cool ring -->
        <ellipse cx="0" cy="0" rx="104" ry="19" fill="none" stroke="#c84b00" stroke-width="6" stroke-opacity="0.45" stroke-dasharray="280 80">
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/>
        </ellipse>
        <!-- Mid ring bright -->
        <ellipse cx="0" cy="0" rx="92" ry="16" fill="none" stroke="#ff9500" stroke-width="8" stroke-opacity="0.6" stroke-dasharray="220 60">
          <animateTransform attributeName="transform" type="rotate" from="30" to="390" dur="13s" repeatCount="indefinite"/>
        </ellipse>
        <!-- Hot inner ring -->
        <ellipse cx="0" cy="0" rx="78" ry="12" fill="none" stroke="#ffc200" stroke-width="9" stroke-opacity="0.75" stroke-dasharray="180 40">
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="9s" repeatCount="indefinite"/>
        </ellipse>
        <!-- Brightest near-horizon ring -->
        <ellipse cx="0" cy="0" rx="64" ry="9" fill="none" stroke="#ffe680" stroke-width="7" stroke-opacity="0.85" stroke-dasharray="150 30">
          <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="6s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <!-- Photon ring / gravitational lensing -->
      <circle cx="0" cy="0" r="56" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.7" filter="url(#glowSoft)">
        <animate attributeName="stroke-opacity" values="0.7;0.4;0.7" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="54" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5">
        <animate attributeName="stroke-opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/>
      </circle>

      <!-- Event horizon shadow (the black hole itself) -->
      <circle cx="0" cy="0" r="50" fill="url(#bhCore)"/>

      <!-- Inner shadow ring to deepen the void -->
      <circle cx="0" cy="0" r="48" fill="#000000"/>

      <!-- Subtle pulsing core hint (barely visible within horizon) -->
      <circle cx="0" cy="0" r="20" fill="#0f0020" opacity="0.6">
        <animate attributeName="r" values="20;24;20" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="8s" repeatCount="indefinite"/>
      </circle>

      <!-- Top bright lensed arc (light bending over the top) -->
      <path d="M -80,-6 Q 0,-70 80,-6" fill="none" stroke="#ffd280" stroke-width="2.5" stroke-opacity="0.6" filter="url(#glowSoft)">
        <animate attributeName="stroke-opacity" values="0.6;0.3;0.6" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M -70,-4 Q 0,-58 70,-4" fill="none" stroke="#ffe8a0" stroke-width="1.5" stroke-opacity="0.4"/>

      <!-- Bottom (Einstein ring arc — reflected) -->
      <path d="M -76,8 Q 0,60 76,8" fill="none" stroke="#ff9500" stroke-width="2" stroke-opacity="0.45" filter="url(#glowSoft)">
        <animate attributeName="stroke-opacity" values="0.45;0.2;0.45" dur="6s" repeatCount="indefinite"/>
      </path>

      <!-- Relativistic jet — upward -->
      <line x1="0" y1="-50" x2="0" y2="-120" stroke="#a855f7" stroke-width="2" stroke-opacity="0.5" filter="url(#glowSoft)">
        <animate attributeName="stroke-opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
      </line>
      <ellipse cx="0" cy="-130" rx="6" ry="18" fill="#7c3aed" opacity="0.3" filter="url(#glowStrong)">
        <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Downward jet -->
      <line x1="0" y1="50" x2="0" y2="130" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.4" filter="url(#glowSoft)">
        <animate attributeName="stroke-opacity" values="0.4;0.08;0.4" dur="3.5s" repeatCount="indefinite"/>
      </line>
      <ellipse cx="0" cy="138" rx="5" ry="14" fill="#0369a1" opacity="0.25" filter="url(#glowStrong)">
        <animate attributeName="opacity" values="0.25;0.04;0.25" dur="3.5s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <!-- ===== END BLACK HOLE ===== -->

    <!-- ===== TEXT — right side (offset from black hole) ===== -->
    <g transform="translate(490, 95)">

      <!-- Greeting -->
      <text x="0" y="0" font-family="'Segoe UI', 'Inter', 'Arial', sans-serif"
            font-size="14" letter-spacing="4" fill="#a78bfa" opacity="0.85"
            font-weight="400">
        WELCOME TO THE UNIVERSE OF
        <animate attributeName="opacity" values="0.85;0.5;0.85" dur="6s" repeatCount="indefinite"/>
      </text>

      <!-- Main name -->
      <text x="-2" y="52" font-family="'Segoe UI', 'Inter', 'Georgia', serif"
            font-size="46" font-weight="800" letter-spacing="2"
            fill="url(#textGrad)" filter="url(#glowSoft)">
        ASWIN BIJU
      </text>

      <!-- Animated underline -->
      <rect x="0" y="60" width="0" height="2" rx="1" fill="url(#subtitleGrad)" opacity="0.8">
        <animate attributeName="width" values="0;280;280" dur="2s" fill="freeze"/>
      </rect>

      <!-- Subtitle / tagline -->
      <text x="2" y="90" font-family="'Segoe UI', 'Inter', 'Arial', sans-serif"
            font-size="14.5" letter-spacing="1.5" fill="url(#subtitleGrad)" opacity="0.9">
        Builder of Systems · Explorer of Frontiers
      </text>

      <!-- Specializations row -->
      <g transform="translate(0, 118)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="1.5s" begin="1.5s" fill="freeze"/>

        <!-- Tag 1 -->
        <rect x="0" y="0" width="110" height="24" rx="12" fill="#7c3aed" fill-opacity="0.25" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.7"/>
        <text x="55" y="16" font-family="'Segoe UI', 'Inter', sans-serif" font-size="11" fill="#c084fc" text-anchor="middle" letter-spacing="0.5">Full Stack Dev</text>

        <!-- Tag 2 -->
        <rect x="118" y="0" width="110" height="24" rx="12" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.7"/>
        <text x="173" y="16" font-family="'Segoe UI', 'Inter', sans-serif" font-size="11" fill="#7dd3fc" text-anchor="middle" letter-spacing="0.5">ML / AI</text>

        <!-- Tag 3 -->
        <rect x="236" y="0" width="130" height="24" rx="12" fill="#831843" fill-opacity="0.25" stroke="#f472b6" stroke-width="0.8" stroke-opacity="0.7"/>
        <text x="301" y="16" font-family="'Segoe UI', 'Inter', sans-serif" font-size="11" fill="#f9a8d4" text-anchor="middle" letter-spacing="0.5">Open Source</text>
      </g>

    </g>
    <!-- ===== END TEXT ===== -->

    <!-- Subtle vignette edge -->
    <rect width="900" height="300" fill="none" stroke="#000" stroke-width="40" opacity="0.5"/>
  </g>
</svg>
