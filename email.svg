<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 42" width="160" height="42">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgEm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240a0a"/>
      <stop offset="50%" stop-color="#140505"/>
      <stop offset="100%" stop-color="#080202"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowEm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Button Background -->
  <rect x="1.5" y="1.5" width="157" height="39" rx="19.5" fill="url(#bgEm)" stroke="#371212" stroke-width="1.2"/>

  <!-- Animated Neon Border Circuit (Perimeter ~353px) -->
  <rect x="1.5" y="1.5" width="157" height="39" rx="19.5" fill="none"
        stroke="#ef4444" stroke-width="1.8" stroke-dasharray="55 298" filter="url(#glowEm)">
    <animate attributeName="stroke-dashoffset" from="353" to="0" dur="3s" repeatCount="indefinite" begin="-1s"/>
  </rect>

  <!-- Left: Mail Icon Tile -->
  <rect x="8" y="7" width="28" height="28" rx="8" fill="#D14836"/>
  <!-- Envelope Icon -->
  <rect x="14" y="14" width="16" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <path d="M 14.5 15.5 L 22 21.5 L 29.5 15.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Live Pulse Beacon -->
  <circle cx="45" cy="21" r="3" fill="#f87171"/>
  <circle cx="45" cy="21" r="3" fill="none" stroke="#f87171" stroke-width="1.5" opacity="0.8">
    <animate attributeName="r" values="3;9;3" dur="2s" repeatCount="indefinite" begin="-0.5s"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite" begin="-0.5s"/>
  </circle>

  <!-- Label Text -->
  <text x="89" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="800" letter-spacing="1.5" fill="#ffe4e6" text-anchor="middle" dominant-baseline="central">
    EMAIL
  </text>

  <!-- Animated Arrow Glyph -->
  <g transform="translate(133, 21)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 1.5,-1.5; 0,0" dur="1.8s" repeatCount="indefinite" begin="-0.6s"/>
      <path d="M -4 4 L 4 -4 M -1 -4 L 4 -4 L 4 1" fill="none" stroke="#f87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
