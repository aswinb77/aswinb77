<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e0a50" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#07071a"/>
    </radialGradient>
    <radialGradient id="sun" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff8d0"/>
      <stop offset="30%" stop-color="#ffe066"/>
      <stop offset="70%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </radialGradient>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc832" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff8800" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#5a9fff"/>
      <stop offset="50%" stop-color="#0A66C2"/>
      <stop offset="100%" stop-color="#062d5a"/>
    </radialGradient>
    <radialGradient id="p2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff9977"/>
      <stop offset="50%" stop-color="#D14836"/>
      <stop offset="100%" stop-color="#5a1a0d"/>
    </radialGradient>
    <radialGradient id="p3" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#88ff55"/>
      <stop offset="50%" stop-color="#22bb44"/>
      <stop offset="100%" stop-color="#0a3a14"/>
    </radialGradient>
    <filter id="glow-sun">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .star { animation: twinkle linear infinite; }
      @keyframes twinkle {
        0%,100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @keyframes orbit1 {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes orbit2 {
        from { transform: rotate(120deg); }
        to   { transform: rotate(480deg); }
      }
      @keyframes orbit3 {
        from { transform: rotate(250deg); }
        to   { transform: rotate(610deg); }
      }
      @keyframes shoot {
        0%   { transform: translate(0,0);   opacity: 0; }
        10%  { opacity: 1; }
        80%  { opacity: 0.8; }
        100% { transform: translate(180px,72px); opacity: 0; }
      }
      @keyframes shoot2 {
        0%   { transform: translate(0,0);   opacity: 0; }
        10%  { opacity: 1; }
        80%  { opacity: 0.7; }
        100% { transform: translate(150px,60px); opacity: 0; }
      }
      @keyframes pulse-sun {
        0%,100% { r: 42; }
        50%      { r: 44; }
      }
      .sun-body { animation: pulse-sun 3s ease-in-out infinite; }
      .moon1 { animation: orbit1 2s linear infinite; transform-origin: 0 0; }
      .moon2 { animation: orbit2 1.4s linear infinite; transform-origin: 0 0; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect width="800" height="420" fill="#07071a"/>
  <ellipse cx="400" cy="210" rx="380" ry="260" fill="url(#bg)"/>

  <!-- Stars -->
  <circle class="star" cx="50"  cy="30"  r="1.2" fill="white" opacity="0.8" style="animation-duration:2.1s"/>
  <circle class="star" cx="130" cy="15"  r="0.9" fill="white" opacity="0.6" style="animation-duration:3.4s"/>
  <circle class="star" cx="220" cy="40"  r="1.1" fill="white" opacity="0.9" style="animation-duration:1.8s"/>
  <circle class="star" cx="310" cy="10"  r="0.7" fill="white" opacity="0.5" style="animation-duration:2.7s"/>
  <circle class="star" cx="450" cy="25"  r="1.0" fill="white" opacity="0.7" style="animation-duration:3.1s"/>
  <circle class="star" cx="560" cy="18"  r="1.3" fill="white" opacity="0.8" style="animation-duration:1.6s"/>
  <circle class="star" cx="650" cy="35"  r="0.8" fill="white" opacity="0.6" style="animation-duration:2.9s"/>
  <circle class="star" cx="720" cy="12"  r="1.0" fill="white" opacity="0.9" style="animation-duration:2.2s"/>
  <circle class="star" cx="780" cy="45"  r="0.7" fill="white" opacity="0.5" style="animation-duration:3.6s"/>
  <circle class="star" cx="75"  cy="80"  r="0.9" fill="white" opacity="0.7" style="animation-duration:2.5s"/>
  <circle class="star" cx="170" cy="95"  r="1.1" fill="white" opacity="0.6" style="animation-duration:1.9s"/>
  <circle class="star" cx="680" cy="80"  r="1.2" fill="white" opacity="0.8" style="animation-duration:3.0s"/>
  <circle class="star" cx="760" cy="100" r="0.8" fill="white" opacity="0.5" style="animation-duration:2.3s"/>
  <circle class="star" cx="30"  cy="150" r="1.0" fill="white" opacity="0.7" style="animation-duration:1.7s"/>
  <circle class="star" cx="100" cy="320" r="1.1" fill="white" opacity="0.8" style="animation-duration:2.8s"/>
  <circle class="star" cx="700" cy="300" r="0.9" fill="white" opacity="0.6" style="animation-duration:3.3s"/>
  <circle class="star" cx="750" cy="380" r="1.0" fill="white" opacity="0.7" style="animation-duration:2.0s"/>
  <circle class="star" cx="40"  cy="390" r="0.7" fill="white" opacity="0.5" style="animation-duration:3.5s"/>
  <circle class="star" cx="580" cy="400" r="1.2" fill="white" opacity="0.8" style="animation-duration:1.5s"/>
  <circle class="star" cx="200" cy="380" r="0.8" fill="white" opacity="0.6" style="animation-duration:2.6s"/>

  <!-- Shooting stars -->
  <line x1="80" y1="55" x2="140" y2="78" stroke="white" stroke-width="1.5" opacity="0"
        style="animation: shoot 4s ease-out 1s infinite; transform-origin: 80px 55px; transform-box: fill-box"/>
  <line x1="500" y1="30" x2="560" y2="54" stroke="white" stroke-width="1.2" opacity="0"
        style="animation: shoot2 4s ease-out 3.5s infinite; transform-origin: 500px 30px; transform-box: fill-box"/>

  <!-- Orbit rings -->
  <!-- Orbit 1: LinkedIn (~orbit 0.28 of min(800,420)=420 = 117.6 => rx=117.6, ry=117.6*0.42=49.4) -->
  <ellipse cx="400" cy="210" rx="118" ry="50" fill="none" stroke="white" stroke-opacity="0.07" stroke-width="0.8"/>
  <!-- Orbit 2: Email (~orbit 0.42 = 176, ry=74) -->
  <ellipse cx="400" cy="210" rx="176" ry="74" fill="none" stroke="white" stroke-opacity="0.07" stroke-width="0.8"/>
  <!-- Orbit 3: Repo (~orbit 0.57 = 239, ry=100) -->
  <ellipse cx="400" cy="210" rx="239" ry="100" fill="none" stroke="white" stroke-opacity="0.07" stroke-width="0.8"/>

  <!-- Sun glow halo -->
  <circle cx="400" cy="210" r="90" fill="url(#sun-glow)"/>

  <!-- Sun -->
  <circle cx="400" cy="210" r="42" fill="url(#sun)" filter="url(#glow-sun)" class="sun-body"/>

  <!-- Planet 1: LinkedIn — orbit around cx=400,cy=210, rx=118,ry=50 -->
  <g style="transform-origin:400px 210px; animation: orbit1 26s linear infinite;">
    <g transform="translate(518,210)">
      <circle r="22" fill="url(#p1)" filter="url(#glow-blue)"/>
      <!-- label badge -->
      <rect x="-28" y="-42" width="56" height="20" rx="5" fill="rgba(10,10,26,0.88)" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>
      <circle cx="-16" cy="-32" r="4" fill="#0A66C2"/>
      <text x="-9" y="-29" font-family="'Courier New',monospace" font-size="9.5" fill="white">LinkedIn</text>
    </g>
  </g>

  <!-- Planet 2: Email — orbit rx=176,ry=74, phase offset -->
  <g style="transform-origin:400px 210px; animation: orbit2 38s linear infinite;">
    <g transform="translate(576,210)">
      <circle r="17" fill="url(#p2)" filter="url(#glow-red)"/>
      <!-- moon -->
      <g class="moon1">
        <circle cx="28" cy="0" r="4" fill="#cccccc"/>
      </g>
      <!-- label -->
      <rect x="-22" y="-37" width="44" height="18" rx="4" fill="rgba(10,10,26,0.88)" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>
      <circle cx="-12" cy="-28" r="3.5" fill="#D14836"/>
      <text x="-5" y="-25" font-family="'Courier New',monospace" font-size="9" fill="white">Email</text>
    </g>
  </g>

  <!-- Planet 3: Repositories — orbit rx=239,ry=100, phase offset -->
  <g style="transform-origin:400px 210px; animation: orbit3 52s linear infinite;">
    <g transform="translate(639,210)">
      <!-- rings -->
      <ellipse rx="46" ry="10" fill="none" stroke="rgba(180,160,90,0.55)" stroke-width="4.5"/>
      <ellipse rx="54" ry="12" fill="none" stroke="rgba(200,180,100,0.28)" stroke-width="8"/>
      <circle r="26" fill="url(#p3)" filter="url(#glow-green)"/>
      <!-- 2 moons -->
      <g class="moon1">
        <circle cx="40" cy="0" r="4.5" fill="#cccccc"/>
      </g>
      <g class="moon2">
        <circle cx="52" cy="0" r="3" fill="#aaaaaa"/>
      </g>
      <!-- label -->
      <rect x="-38" y="-48" width="76" height="18" rx="4" fill="rgba(10,10,26,0.88)" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>
      <circle cx="-27" cy="-39" r="3.5" fill="#39FF14"/>
      <text x="-20" y="-36" font-family="'Courier New',monospace" font-size="9" fill="white">Repositories</text>
    </g>
  </g>

  <!-- Name text -->
  <text x="400" y="272" text-anchor="middle" font-family="'Courier New',monospace" font-size="17" font-weight="bold" fill="rgba(255,255,255,0.88)">✦  Aswin Biju  ✦</text>
  <text x="400" y="291" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="rgba(180,180,220,0.62)">Full-Stack · AI · Engineering</text>
</svg>
