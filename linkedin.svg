<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
    @keyframes liPulse {
      0%, 100% {
        filter: drop-shadow(0 0 4px rgba(10, 102, 194, 0.45)) drop-shadow(0 0 12px rgba(10, 102, 194, 0.3));
      }
      50% {
        filter: drop-shadow(0 0 8px rgba(10, 102, 194, 0.85)) drop-shadow(0 0 22px rgba(10, 102, 194, 0.6));
      }
    }
    .li-anim {
      animation: liPulse 3.2s ease-in-out infinite;
      transform-origin: center;
    }
  </style>
  <g class="li-anim">
    <!-- Rounded Square Border -->
    <rect x="16" y="16" width="96" height="96" rx="24" fill="none" stroke="#0a66c2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Dot of i -->
    <circle cx="42" cy="42" r="6.4" fill="#0a66c2"/>
    
    <!-- Stem of i -->
    <rect x="36" y="54" width="12" height="34" rx="4" fill="#0a66c2"/>
    
    <!-- Letter n -->
    <path fill="#0a66c2" d="M58 54h11.5v5.8c3.2-4.5 8-6.5 14.5-6.5 9.8 0 16 6.4 16 17.8v16.9H87.5V71.8c0-5.6-2.8-8.8-8-8.8-5.2 0-8.5 3.2-8.5 8.8v16.2H58V54z"/>
  </g>
</svg>