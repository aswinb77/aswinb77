<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 42" width="176" height="42">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgLi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1527"/>
      <stop offset="50%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowLi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Button Background -->
  <rect x="1.5" y="1.5" width="173" height="39" rx="19.5" fill="url(#bgLi)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Animated Neon Border Circuit (Perimeter ~385px) -->
  <rect x="1.5" y="1.5" width="173" height="39" rx="19.5" fill="none"
        stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="60 325" filter="url(#glowLi)">
    <animate attributeName="stroke-dashoffset" from="385" to="0" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Left: Official LinkedIn Icon Tile -->
  <rect x="8" y="7" width="28" height="28" rx="8" fill="#0A66C2"/>
  <circle cx="16.5" cy="14.5" r="1.6" fill="#ffffff"/>
  <rect x="15" y="18" width="3" height="10" rx="0.5" fill="#ffffff"/>
  <path d="M 21 18 v 10 m 0 -6.5 c 0 -2.2 1.6 -3.5 3.5 -3.5 s 3.5 1.3 3.5 3.5 v 6.5"
        fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Live Pulse Beacon -->
  <circle cx="45" cy="21" r="3" fill="#38bdf8"/>
  <circle cx="45" cy="21" r="3" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8">
    <animate attributeName="r" values="3;9;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Label Text -->
  <text x="98" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="800" letter-spacing="1.5" fill="#e0f2fe" text-anchor="middle" dominant-baseline="central">
    LINKEDIN
  </text>

  <!-- Animated Arrow Glyph -->
  <g transform="translate(148, 21)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 1.5,-1.5; 0,0" dur="1.8s" repeatCount="indefinite"/>
      <path d="M -4 4 L 4 -4 M -1 -4 L 4 -4 L 4 1" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
