<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 42" width="196" height="42">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgRepo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2312"/>
      <stop offset="50%" stop-color="#04140a"/>
      <stop offset="100%" stop-color="#010703"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowRepo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Button Background -->
  <rect x="1.5" y="1.5" width="193" height="39" rx="19.5" fill="url(#bgRepo)" stroke="#064e1e" stroke-width="1.2"/>

  <!-- Animated Neon Border Circuit (Perimeter ~425px) -->
  <rect x="1.5" y="1.5" width="193" height="39" rx="19.5" fill="none"
        stroke="#39FF14" stroke-width="1.8" stroke-dasharray="65 360" filter="url(#glowRepo)">
    <animate attributeName="stroke-dashoffset" from="425" to="0" dur="3s" repeatCount="indefinite" begin="-2s"/>
  </rect>

  <!-- Left: Git Branch Icon Tile -->
  <rect x="8" y="7" width="28" height="28" rx="8" fill="#15803d"/>
  <circle cx="17" cy="14" r="2.2" fill="#ffffff"/>
  <circle cx="17" cy="27" r="2.2" fill="#ffffff"/>
  <circle cx="26" cy="17" r="2.2" fill="#ffffff"/>
  <path d="M 17 16 v 9 M 17 21.5 c 2.5 0 5.5 -1 8 -3.2"
        fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Live Pulse Beacon -->
  <circle cx="45" cy="21" r="3" fill="#39FF14"/>
  <circle cx="45" cy="21" r="3" fill="none" stroke="#39FF14" stroke-width="1.5" opacity="0.8">
    <animate attributeName="r" values="3;9;3" dur="2s" repeatCount="indefinite" begin="-1s"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite" begin="-1s"/>
  </circle>

  <!-- Label Text -->
  <text x="108" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="800" letter-spacing="1.5" fill="#f0fdf4" text-anchor="middle" dominant-baseline="central">
    REPOSITORIES
  </text>

  <!-- Animated Arrow Glyph -->
  <g transform="translate(169, 21)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 1.5,-1.5; 0,0" dur="1.8s" repeatCount="indefinite" begin="-1.2s"/>
      <path d="M -4 4 L 4 -4 M -1 -4 L 4 -4 L 4 1" fill="none" stroke="#39FF14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
